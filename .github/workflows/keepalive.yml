# Бесплатный веб-сервис Render засыпает через ~15 минут без входящих запросов.
# Резервный узел (NODE_PRIORITY=0) должен быть всегда включён, чтобы подхватить бота,
# когда ПК выключен, поэтому раз в 10 минут его будим. Адрес можно переопределить
# переменной репозитория KEEPALIVE_URL (Settings -> Secrets and variables -> Actions -> Variables).
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://tg-assistant-standby.onrender.com/' }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 10 "$URL" || true)
          echo "HTTP $code from $URL"
          if [ "${code:-000}" -ge 400 ] || [ "${code:-000}" = "000" ]; then
            echo "::warning::keepalive ping got HTTP ${code:-000}"
          fi
