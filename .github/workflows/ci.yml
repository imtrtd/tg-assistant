name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tga
          POSTGRES_PASSWORD: tga
          POSTGRES_DB: tga
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tga" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tga:tga@localhost:5432/tga
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Все тесты на Postgres (включая выбор лидера)
        run: pytest
      - name: Миграции и перенос данных из SQLite в пустой Postgres
        run: |
          psql postgresql://tga:tga@localhost:5432/postgres -c "create database copytest"
          TEST_COPY_TARGET_URL=postgresql+asyncpg://tga:tga@localhost:5432/copytest \
            pytest tests/test_copy_db.py tests/test_migrations.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tg-assistant .
      - name: Миграции применяются внутри образа
        run: |
          docker run --rm -e TELEGRAM_BOT_TOKEN=1:fake tg-assistant python -c "
          from tg_assistant.db import run_migrations
          run_migrations('sqlite+aiosqlite:////tmp/bot.db')
          import sqlite3
          tables = {r[0] for r in sqlite3.connect('/tmp/bot.db').execute('select name from sqlite_master')}
          assert {'users', 'notes', 'reminders'} <= tables, tables
          from tg_assistant.web.app import STATIC_DIR
          assert (STATIC_DIR / 'index.html').is_file() and (STATIC_DIR / 'app.js').is_file()
          "
      - name: В образе есть cloudflared для мини-приложения
        run: docker run --rm --entrypoint cloudflared tg-assistant --version
      - run: bash -n deploy/setup-vps.sh deploy/update.sh deploy/backup.sh deploy/failover/compose.sh
      - name: Схема «ПК + облако» собирается
        run: |
          touch .env
          COMPOSE_PROFILES=db docker compose --env-file .env -f deploy/failover/docker-compose.yml config -q
          COMPOSE_PROFILES=remote-db docker compose --env-file .env -f deploy/failover/docker-compose.yml config -q
